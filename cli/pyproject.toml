[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-report"
version = "1.0.0"
description = "CLI for reporting Claude Code / Codex agent work to the local Rembrosoft Agent Hub"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
agent-report = "agent_report.cli:main"

[tool.setuptools]
packages = ["agent_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
